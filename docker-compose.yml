services:
  job-queue:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Persist job data across restarts
      - ./jobs:/app/jobs
      # Mount resume generator for generation subprocess
      - "/Volumes/Hyy Mac mini HD/Program Data/GitHub/Re-Generator:/resume-generator:ro"
      # Mount browser-use for extraction subprocess
      - "/Volumes/Hyy Mac mini HD/Program Data/GitHub/browser-use:/browser-use:ro"
    environment:
      - JQ_PORT=8080
      - JQ_HOST=0.0.0.0
      - JQ_RESUME_GENERATOR_DIR=/resume-generator
      - JQ_BROWSER_USE_REPO=/browser-use
      # CDP connects to host Chrome (host.docker.internal on Docker Desktop)
      - JQ_CDP_URL=http://host.docker.internal:9222
      # Pass through API key if set
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
